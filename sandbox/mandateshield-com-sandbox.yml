summary: 'MandateShield publishes an unusually explicit test surface: a zero-account strict-lifecycle sandbox endpoint
  that simulates all eleven lifecycle stages with isolated fixtures, an anonymous analysis allowance on the v1 preflight
  endpoint, a test/live key-prefix split, a browser-local conformance runner and a free guided private pilot. Because
  the service takes no payment credentials by design there are no test cards, test bank accounts or test clocks
  — the fixtures are signed test mandates and keys generated inside the run.'
test_vs_live:
  key_prefixes:
    test: ms_test_...
    live: ms_live_...
  source: openapi securitySchemes.bearerAuth.bearerFormat and the A2A card securitySchemes
  semantics: sandbox, test and v1 results always set enforcement_authorized=false; only a strict v2 live decision
    can create a RESERVED execution authorization. A test key persists decisions (up to 5,000 per month) so integration
    tests are repeatable; the anonymous sandbox keeps no replay history.
  key_roles: VERIFY keys issue challenges and strict decisions; PROCESSOR keys are bound to one processor_audience
    and can only call execution transitions and permit redemption.
sandbox:
  present: true
  account_required: false
  endpoint: POST https://mandateshield.com/api/v2/sandbox/lifecycle
  operation: runStrictLifecycleSandbox
  specification: https://mandateshield.com/specifications/strict-lifecycle-sandbox/v1
  page: https://mandateshield.com/sandbox
  stages:
  - Fresh challenge issued
  - Account-pinned authority verified
  - Active mandate evaluated
  - Decision evidence signed
  - Budget reserved atomically
  - Authorization consumed once
  - Provider-bound permit issued
  - Fresh permit claim granted
  - Permit replay suppressed
  - Sandbox provider attested
  - Terminal reconciliation recorded
  guarantees_stated:
    money_moved: false
    external_provider_contacted: false
    payment_credentials: none accepted
    production_authorization: none
    independent_organization_involved: false
  rate_limit: 429 "Public sandbox rate limit exceeded" (numeric limit not published)
  note: The separate provider key is generated inside the same sandbox run; every accepted response must explicitly
    affirm money_moved=false. The browser page renders the server response and marks nothing complete until the
    endpoint returns it.
anonymous_analysis:
  endpoint: POST https://mandateshield.com/api/v1/preflight (and /api/v1/batch)
  operation: evaluatePurchase
  allowance: Validate 200 mandates every day without an account (pricing page, "NO-ACCOUNT SANDBOX · CURRENT LIMITS")
  persisted: false
  probe:
    fetched: '2026-09-19'
    request: POST /api/v1/preflight with body {} and no Authorization header
    http_status: 200
    response: decision BLOCK, score 0, 12+ findings (UNSUPPORTED_PROTOCOL, MISSING_MANDATE_ID, MISSING_AGENT_ID,
      MISSING_MERCHANT, INVALID_AMOUNT, INVALID_CURRENCY, MISSING_SPEND_CAP, ..., REPLAY_GUARD_MISSING) and a sha256
      receipt hash
    note: The live policy engine answers anonymously with structured findings; no rate-limit headers were returned
      on this response.
  browser_tools:
