  - https://mandateshield.com/tools/ai-payment-mandate-builder
  - https://mandateshield.com/tools/cryptographic-authority-verifier
  - https://mandateshield.com/tools/protocol-bridge
test_key:
  how: Sign in (Sign in with ChatGPT) and create a test key in the dashboard
  quota: up to 5,000 persisted decisions per month
  source: https://mandateshield.com/pricing
conformance_runner:
  url: https://mandateshield.com/conformance
  offline_vectors: 8
  integration_targets: 11
  note: Eight deterministic vectors execute in the browser with no API key or request to MandateShield; the 19-vector
