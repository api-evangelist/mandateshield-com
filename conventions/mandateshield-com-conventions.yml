cors:
  options_operations: 17
  allow_origin: '* (observed on /api/v1/preflight)'
  note: Every public endpoint has an explicit OPTIONS operation ("Inspect CORS support") in the contract.
link_headers: 'Responses carry Link: rel="terms-of-service", rel="privacy-policy", rel="describedby" (/.well-known/legal.json).'
money_representation:
  fiat: integer minor units (max_amount_minor) with ISO 4217 currency; exact major/minor agreement is checked and
    zero-decimal currencies must not be rounded
  atomic_assets: canonical decimal digit string atomic_units with explicit asset_decimals (0–30), asset_id (e.g.
    eip155:8453/erc20:0x...), network and resource; compared with BigInt semantics, never converted to Number
dry_run:
  supported: true
  mode: v1 analysis-only profile
  operations:
  - evaluatePurchase
  - evaluatePurchaseBatch
  - normalizeAgentPaymentProtocol
  - runStrictLifecycleSandbox
  semantics: Always enforcement_authorized=false, even with a live key; returns the same decision/findings shape
    as strict v2 without reserving authority. The zero-account lifecycle sandbox rehearses the full 11-stage state
    machine with isolated fixtures (money_moved=false).
  docs: https://mandateshield.com/docs#analysis-only
reversibility:
  grade: documented
  money_movement: none — MandateShield never moves money; a provider refund/void belongs to the provider (Stripe
    / x402) and is out of this contract's scope
  write_surfaces:
  - surface: RESERVED execution authorization (created by verifyCryptographicAuthority / verifyCryptographicAuthorityBatch)
    reversal:
      operation: transitionExecutionAuthorization
      action: RELEASE
      effect: returns the reserved cumulative-budget headroom
    automatic_reversal: an unconsumed reservation expires (expires_at on ExecutionAuthorizationReservation; 410
      "Reserved execution authorization expired") and its budget is returned
    window: until CONSUME or until expires_at; the reservation is described as "short" and no fixed duration is
      published
    docs: 'https://mandateshield.com/docs (Cumulative budgets: "COMMIT transfers reserved spend to committed spend;
      RELEASE or an unconsumed expiry returns it.")'
  - surface: CONSUMED execution authorization (transitionExecutionAuthorization CONSUME)
    reversal:
      operation: transitionExecutionAuthorization
      action: RELEASE
      effect: returns budget for a confirmed non-submission; COMMIT finalizes instead
    window: before the settlement deadline; after it an unresolved outcome is charged conservatively and never auto-released
      — the deadline's length is not published
    constraint: '"If submission may have happened but its result is unknown, do not RELEASE or submit again." Autonomous
      RELEASE/COMMIT happens only on PROVIDER_API_VERIFIED or CHAIN_FINALIZED evidence.'
    docs: https://mandateshield.com/docs
  - surface: Permit claim (redeemExecutionPermit)
    reversal: null
    window: not reversible — single-winner claim; the permit itself lives at most 60 seconds with max_uses 1, and
      an exact retry returns the same claim with permission false
    docs: https://mandateshield.com/docs (Fresh provider-bound claim)
  - surface: Account-wide execution interlock PAUSE (setGlobalExecutionInterlock)
    reversal:
      operation: setGlobalExecutionInterlock
      action: RESUME
      effect: re-enables new execution; compare-and-set on expected_generation
    window: none stated (any time, by the authenticated account owner)
    docs: https://mandateshield.com/specifications/global-execution-interlock/v1
  - surface: v1 analysis decisions / sandbox runs
    reversal: na
    window: na
    note: Non-executable; nothing to reverse.
  note: 'Graded documented, not verified: reversal operations exist (RELEASE, RESUME, expiry) and the docs name
    the conditions, but no stated numeric window (reservation TTL, settlement deadline) is published for RELEASE.
    The 60-second figure is the permit lifetime, not a reversal window.'
