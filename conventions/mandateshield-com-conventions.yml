media_type: application/json
auth:
  style: HTTP Bearer API keys with two roles, plus a hosting-injected session assertion for the account control
    plane
  detail: authentication/mandateshield-com-authentication.yml
  key_roles:
    VERIFY: issues challenges and strict decisions (createVerificationChallenge, verifyCryptographicAuthority, verifyCryptographicAuthorityBatch);
      cannot transition state
    PROCESSOR: bound at creation to one exact processor_audience; can call transitionExecutionAuthorization, redeemExecutionPermit
      and reportProviderSubmission; cannot issue challenges or create authorizations
  key_prefixes:
    test: ms_test_
    live: ms_live_
  anonymous_surface:
  - evaluatePurchase
  - evaluatePurchaseBatch
  - normalizeAgentPaymentProtocol
  - runStrictLifecycleSandbox
  - verifyDecisionReceipt
  - verifyExecutionPermit
  - verifyExecutionReceipt
  - getReceiptTransparency
  - proof network and deployment-proof reads
  - getThreatIntelligence
idempotency:
  supported: true
  coverage: partial
  mechanism: request-body field idempotency_key (pattern ^[A-Za-z0-9._:~-]{1,256}$); redeemExecutionPermit additionally
    accepts an Idempotency-Key header
  scope:
  - operation: evaluatePurchase
    path: POST /api/v1/preflight
    field: idempotency_key (required, PurchaseEnvelope)
  - operation: evaluatePurchaseBatch
    path: POST /api/v1/batch
    field: idempotency_key per envelope item
  - operation: verifyCryptographicAuthority
    path: POST /api/v2/verify
    field: envelope.idempotency_key (required) — the account-wide replay key for the attempt
  - operation: verifyCryptographicAuthorityBatch
    path: POST /api/v2/batch
    field: envelope.idempotency_key per item ("every item needs its own idempotency key and unconsumed challenge")
  - operation: transitionExecutionAuthorization
    path: POST /api/v2/execution-authorizations
    field: 'idempotency_key (required, transition-specific: e.g. <attempt>:consume)'
  - operation: redeemExecutionPermit
    path: POST /api/v2/execution-permits/redeem
    field: idempotency_key in body and Idempotency-Key header; an exact retry returns the same claim with permission
      false
  - operation: normalizeAgentPaymentProtocol
    path: POST /api/v2/normalize
    field: context.idempotency_key (optional; projection is non-executable)
  not_covered:
  - operation: createVerificationChallenge
    why: consume-once server nonce (5 minutes) rather than a caller key
  - operation: reportProviderSubmission
    why: keyed by provider_submission_id/permit_id/claim_id; stored as a CALLER_ASSERTED hint, not a state transition
  - operation: setGlobalExecutionInterlock
    why: compare-and-set on expected_generation (optimistic concurrency), not an idempotency key
  - operation: createPublicProofChallenge
    why: no idempotency field
  - operation: issuePublicProofAttestation
    why: no idempotency field
  - operation: runStrictLifecycleSandbox
    why: stateless simulation
  - operation: receiveStripeProviderWebhook
    why: inbound Stripe event; Stripe-Signature authenticated, treated as a hint
  uniqueness_boundary: account-wide, not per API key — "rotating credentials cannot make a consumed attempt executable
    again"
  retention: undocumented as a duration; described as durable account-wide replay tombstones that survive API-key
    rotation. Evidence retention per plan is 30/60/90 days (plans/).
  replay_semantics: Keep one stable key per intended payment across transport retries; use distinct stable keys
    for VERIFY, CONSUME and the terminal COMMIT/RELEASE; reconcile a timed-out request before creating a new attempt.
    An exact-input retry is not a second billed decision. Provider-native idempotency remains mandatory because
    MandateShield never submits to the provider itself.
  header: Idempotency-Key (redeemExecutionPermit only)
  note: coverage is partial rather than full because the mechanism spans the whole payment-authority write path
    (7 operations) but not the account interlock, proof-network writes or the submission report. Every operation
    that reserves, consumes or claims spend authority carries a key.
