request_tracing:
  request_id_header: null
  note: No request-id header is documented or observed. Traceability is carried by receipt_id (msr_...), permit_id
    (msp_...), claim_id and provider_submission_id in bodies, and by the sha256 receipt hash returned even on anonymous
    v1 decisions.
versioning:
  style: URI path generation (/api/v1 analysis-only, /api/v2 strict) plus semver contract/product versions with
    immutable versioned documents
  header: null
  detail: lifecycle/mandateshield-com-lifecycle.yml
  terms_version_header: x-mandateshield-terms-version (observed 2026-07-28.2 on live responses)
errors:
  envelope: '{ error: string, code?: string, enforcement_authorized?: boolean }'
  media_type: application/json
  rfc9457: false
  detail: errors/mandateshield-com-problem-types.yml
  decision_findings: Decisions (not HTTP errors) carry findings[] {code, message, severity} drawn from the 91-code
    reason registry — errors/mandateshield-com-error-codes.yml
  fail_closed: 400/401/402/403/404/409/410/413/429/503 all leave execution unauthorized; an unavailable outcome
    check keeps the authorization reserved and forbids a blind provider retry.
