state_machine:
  entity: ExecutionAuthorizationState
  states:
  - RESERVED
  - CONSUMED
  - COMMITTED
  - RELEASED
  - EXPIRED
  - SETTLEMENT_UNKNOWN
  - NOT_RESERVED
  - ARCHIVAL_ONLY
  transitions:
    verify (ALLOW, live, pinned): -> RESERVED
    CONSUME: RESERVED -> CONSUMED (issues permit + prepared ProviderSubmission)
    COMMIT: CONSUMED -> COMMITTED
    RELEASE: RESERVED|CONSUMED -> RELEASED
    EXPIRE / expires_at: RESERVED -> EXPIRED
    unresolved after settlement deadline: CONSUMED -> SETTLEMENT_UNKNOWN (charged conservatively, never auto-released)
  transition_operation: transitionExecutionAuthorization
id_prefixes:
  msr_: decision receipt_id (^msr_[a-f0-9]{32}$, from the CLI)
  msp_: execution permit_id (^msp_[a-f0-9]{32}$)
  mnd_: mandate_id in docs examples (e.g. mnd_2048) — convention, not enforced by the schema
  ms_test_ / ms_live_: API keys (VERIFY or PROCESSOR role)
  'sha256:': mandate_hash, receipt hash and intent digests
