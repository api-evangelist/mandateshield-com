summary: 'The data core is a decision-and-evidence chain, not a CRUD object graph: a PurchaseEnvelope (bound to
  a registered mandate, agent and merchant) is verified against a one-time Challenge into a StrictDecision whose
  SignedDecisionReceipt is the execution-authorization token; a PROCESSOR-side transition consumes it into a SignedExecutionPermit
  and ProviderSubmissionRecord; redemption, provider evidence and reconciliation close the chain with a SignedExecutionReceipt.
  Mandates and API keys are control-plane objects managed in the dashboard and are referenced by id only — the contract
  has no mandate or key CRUD.'
