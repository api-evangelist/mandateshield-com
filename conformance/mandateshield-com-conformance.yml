domain_standards:
  market: agentic payments / AI-agent purchase authorization
  note: The contract itself declares the agent-payment protocols it adapts. These are recorded as contract signatures
    with exact spec locations; whether the scorer recognises them as domain standards is the rubric's call, not
    this file's. MandateShield states it claims no provider or facilitator adoption of any of them.
  signatures:
  - id: ap2
    name: Agent Payments Protocol (AP2)
    declared_in_contract: true
    evidence:
    - components.schemas.PurchaseEnvelope.properties.protocol.enum includes AP2
    - POST /api/v2/normalize adapter enum AP2_CLOSED_PAYMENT_SD_JWT
    - MCP tool normalize_agent_payment_protocol adapter enum
    scope: closed-payment SD-JWT projection only (docs)
  - id: x402-v2
    name: x402 v2 (exact / EIP-3009)
    declared_in_contract: true
    evidence:
    - PurchaseEnvelope.protocol enum X402
    - adapter enum X402_V2_PAYMENT_REQUIRED
    - reason codes HTTP_REQUEST_BINDING_INVALID, INVALID_ATOMIC_AMOUNT, ATOMIC_SPEND_CAP_EXCEEDED
    - x402 chain verification component in /api/health
    scope: pre-payment projection and CHAIN_FINALIZED outcome verification; MandateShield does not create or submit
      the x402 payment signature
  - id: mpp
    name: Machine Payments Protocol (MPP HTTP Payment challenge)
    declared_in_contract: true
    evidence:
    - PurchaseEnvelope.protocol enum MPP
    - adapter enum MPP_HTTP_PAYMENT_CHALLENGE
    - payee_identity oneOf branch provider MPP (TLS_SERVICE_ORIGIN verification)
  - id: tap
    name: Visa Trusted Agent Protocol (TAP)
    declared_in_contract: true
    evidence:
    - PurchaseEnvelope.protocol enum TAP
    - HttpSignatureInput schema (RFC 9421-style components, content-digest, 15-minute window per docs)
  - id: ucp
    name: Universal Commerce Protocol (UCP)
    declared_in_contract: true
    evidence:
    - PurchaseEnvelope.protocol enum UCP
    note: Protocol label only; no UCP-specific adapter or /.well-known/ucp.json (404).
  - id: acp
    name: Agentic Commerce Protocol (ACP)
    declared_in_contract: true
    evidence:
    - PurchaseEnvelope.protocol enum ACP
    note: Protocol label only; /.well-known/acp.json 404.
  - id: stripe-payment-intents
    name: Stripe PaymentIntents provider profile
    declared_in_contract: true
    evidence:
    - provider_binding.profile STRIPE_PAYMENT_INTENTS_V1 (docs)
    - POST /api/v2/provider-webhooks/stripe/{connectionId} with Stripe-Signature header (receiveStripeProviderWebhook)
    - PROVIDER_API_VERIFIED evidence class
