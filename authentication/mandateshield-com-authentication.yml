key_roles:
- role: VERIFY
  can:
  - createVerificationChallenge
  - verifyCryptographicAuthority
  - verifyCryptographicAuthorityBatch
  - verify_cryptographic_payment_authority (MCP)
  - A2A strict skill
  cannot:
  - transition an execution authorization
  - redeem a permit
  placement: trusted server-side verification worker; may be passed to an MCP/A2A client only as a server-side Authorization
    header
- role: PROCESSOR
  can:
  - transitionExecutionAuthorization (CONSUME / COMMIT / RELEASE / EXPIRE)
  - redeemExecutionPermit
  - reportProviderSubmission
  cannot:
  - issue a challenge
  - create an authorization
  binding: bound at creation to one exact processor_audience; the signed receipt and expected_audience must match
    it
  placement: inside the trusted gateway; the redemption credential only inside the customer-deployed exclusive executor
    with the provider credential — never the agent, model, browser, merchant page or verification worker
key_prefixes:
  test: ms_test_
  live: ms_live_
  note: From bearerFormat in the spec and the A2A card. Test keys persist up to 5,000 decisions per month and never
    produce enforcement_authorized=true.
