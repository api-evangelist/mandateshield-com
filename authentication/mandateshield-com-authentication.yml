schemes:
- name: hostingSession
  type: apiKey
  in: header
  parameter: OAI-Authenticated-User-Email
  description: Hosting-injected authenticated account-owner identity. The hosting boundary validates the user session
    and injects this assertion; callers cannot authenticate by supplying this header directly. State-changing control-plane
    requests additionally require the trusted same-origin check documented by the operation.
  sources:
  - openapi/mandateshield-com-openapi.yml
- name: bearerAuth
  type: http
  scheme: bearer
  bearerFormat: ms_test_… or ms_live_…
  description: Keep API keys server-side and isolate them by purpose. VERIFY keys can issue challenges and strict
    decisions. Paid live PROCESSOR keys are bound to one processor_audience and can call only the execution-transition
    boundary.
  sources:
  - openapi/mandateshield-com-openapi.yml
