agent_card:
  name: MandateShield Payment Authority Agent
  description: Provides strict cryptographic reservation of AI-agent payment authority and a separate non-executable
    policy-analysis path. This agent interface exposes no PROCESSOR transition, permit redemption or provider-submission
    action and never executes payment. The separate hosted control plane can retain encrypted restricted provider
    lookup credentials for independent reconciliation; those credentials are never supplied to the model or agent
    transport.
  version: 1.13.0
  documentation_url: https://mandateshield.com/developers
  provider:
    organization: MandateShield
    url: https://mandateshield.com
  supported_interfaces:
  - url: https://mandateshield.com/a2a
    protocol_binding: JSONRPC
    protocol_version: '1.0'
  - url: https://mandateshield.com/a2a
    protocol_binding: JSONRPC
    protocol_version: '0.3'
  capabilities:
    streaming: false
    push_notifications: false
    extended_agent_card: false
    extensions:
    - https://mandateshield.com/specifications/agent-card-extension/v1
  default_input_modes:
  - application/json
  - text/plain
  default_output_modes:
  - application/json
  - text/plain
  security_schemes:
