apis:
- aid: mandateshield-com:mcp-server
  name: MandateShield MCP Server
  description: >-
    Hosted, stateless Streamable HTTP MCP server at https://mandateshield.com/api/mcp. Anonymous initialize
    and tools/list; three tools (check_ai_payment_authority, normalize_agent_payment_protocol, verify_cryptographic_payment_authority),
    the third requiring a VERIFY-scoped Bearer key. A no-auth plugin profile at /api/mcp/plugin exposes
    the first two. Registry manifest at /server.json (com.mandateshield/payment-authority). Exposes no
    PROCESSOR, permit-redemption or provider-submission tool by design.
  humanURL: https://mandateshield.com/connect
  baseURL: https://mandateshield.com/api/mcp
