aid: mandateshield-com
name: MandateShield
description: MandateShield is a fail-closed authority-verification and execution-evidence boundary for autonomous
  AI-agent purchases, operated from Bern, Switzerland. It binds a signed purchase approval (AP2, TAP, UCP, x402,
  MPP, ACP or a custom envelope) to a registered mandate and a pinned issuer key, reserves cumulative budget atomically,
  consumes the reservation into a one-use provider-bound execution permit for an exact Stripe PaymentIntent or x402
  request, and then checks the provider outcome without trusting the caller before issuing a signed terminal receipt.
  The hosted service never moves money or holds payment credentials. It publishes an OpenAPI 3.1 contract with 26
  operations, a remote MCP server whose tools/list answers anonymously, a signed A2A agent card, llms.txt, an SPDX
  SBOM, a JWKS, a 91-code reason registry, a 19-vector conformance suite and self-hosted JavaScript, Python and
  Go clients.
image: https://mandateshield.com/icon-512.png
url: https://raw.githubusercontent.com/api-evangelist/mandateshield-com/refs/heads/main/apis.yml
x-type: company
x-source: harvest:a2a-registry
x-tier: profiled
x-tier-reason: enrichment pass 2026-09-19 (local-v3; was a2a-registry harvest stub)
