- aid: mandateshield-com:a2a-agent
  name: MandateShield Payment Authority Agent (A2A)
  description: 'JSONRPC A2A interface at https://mandateshield.com/a2a serving A2A 1.0 and 0.3 profiles (selected
    by the A2A-Version header) with three skills: project agent payment fields, analyze AI payment policy, verify
    cryptographic payment authority. Signed agent card at /.well-known/agent-card.json; the interface exposes no
    payment execution.'
  humanURL: https://mandateshield.com/developers
